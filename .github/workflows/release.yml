name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          version=$(python3 -c "
          import json, sys
          try:
              with open('manifest.json') as f:
                  m = json.load(f)
              version = m.get('version')
              if not version:
                  print('ERROR: version field missing from manifest.json', file=sys.stderr)
                  sys.exit(1)
              print(version)
          except (json.JSONDecodeError, OSError) as e:
              print(f'ERROR: could not read manifest.json: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.tag_check.outputs.exists == 'false'
        with:
          node-version: 20

      - name: Build extension zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          npm install -g web-ext
          web-ext build --source-dir . --artifacts-dir dist --ignore-files '.github/**' 'README.md' 'LICENSE'

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Glyphy v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.zip
