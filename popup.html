<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>FontFreedom</h1>
  <p id="active-font" class="active-font"></p>
  <p class="domain">Font for <span id="domain">…</span></p>

  <label class="field">
    <span>Font</span>
    <select id="font"></select>
  </label>

  <label class="toggle">
    <input type="checkbox" id="enabled" checked>
    <span>Enabled on this site</span>
  </label>

  <div class="actions">
    <button id="save" class="primary">Save</button>
    <button id="reset">Reset</button>
  </div>

  <p id="status" class="status"></p>
  <a id="manage" href="#">Manage all sites →</a>

  <script src="popup.js"></script>
</body>
</html>
